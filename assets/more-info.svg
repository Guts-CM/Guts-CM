<svg xmlns="http://www.w3.org/2000/svg" width="220" height="72" viewBox="0 0 220 72">
  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .btn { animation: float 4.8s ease-in-out infinite; }
  </style>
  <g class="btn">
    <rect x="20" y="18" width="180" height="36" rx="18" fill="#0a0a0b" stroke="#2d6c5f" stroke-width="1" stroke-opacity="0.65"/>
    <text x="110" y="33.5" fill="#e7e7ea" font-size="13" text-anchor="middle" dominant-baseline="middle">more info</text>
    <path d="M104 46 L110 51 L116 46" fill="none" stroke="#2d6c5f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>
